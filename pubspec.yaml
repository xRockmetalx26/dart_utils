name: dart_utils
description: "Dart Utils."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.1+1
environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Architecture
  equatable: ^2.0.7
  get_it: ^8.0.3
  import_sorter: ^4.6.0
  either_dart: ^1.0.0
  provider: ^6.1.2
  envied: ^1.1.1

  # Phone services
  geolocator: ^13.0.2
  fluttertoast: ^8.2.12
  url_launcher: ^6.3.1

  # Device/App information
  package_info_plus: ^8.2.1
  device_info_plus: ^11.3.0

  # File management
  path_provider: ^2.1.5
  android_path_provider: ^0.3.1

  # Local storage
  hive: ^2.2.3

  # Google/Firebase
  firebase_storage: ^12.4.2

  # Internet packages
  connectivity_plus: ^6.1.3

  # Widgets
  country_code_picker: ^3.2.0
  flutter_keyboard_visibility: ^6.0.0
  flutter_spinkit: ^5.2.1

  # Paging
  infinite_scroll_pagination: ^4.1.0

  # Image packages
  cached_network_image: ^3.4.1

  # Audio packages
  ffmpeg_kit_flutter_full: ^6.0.3

  # Utils
  mask: ^1.0.5

  # Others
  material_design_icons_flutter: ^7.0.7296
  intl: ^0.20.2

  # Implicit
  collection:

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  # App icons
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
